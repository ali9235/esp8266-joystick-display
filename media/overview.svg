<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">VOLTRA Arcade illustrated architecture</title>
<desc id="desc">Educational reference workflow, not proof of hardware operation.</desc>
<rect width="960" height="380" rx="20" fill="#0b111b"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="42" fill="#adacff" font-size="18" letter-spacing="5">VOLTRA</text>
<text x="36" y="95" fill="#ecf2f7" font-size="40" font-weight="700">Arcade</text>
<text x="36" y="132" fill="#a2b2c5" font-size="21">One axis. A small screen. A playable idea.</text>
<rect x="36" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#adacff"/>
<text x="54" y="200" fill="#adacff" font-size="16">01</text>
<text x="54" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Read one axis</text>
<text x="54" y="263" fill="#a2b2c5" font-size="13">Serial input or optional joystick</text>
<path d="M322 230h12m-4-4 4 4-4 4" fill="none" stroke="#adacff" stroke-width="2"/>
<rect x="340" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#adacff"/>
<text x="358" y="200" fill="#adacff" font-size="16">02</text>
<text x="358" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Update the game</text>
<text x="358" y="263" fill="#a2b2c5" font-size="13">Paddle, ball, collisions and lives</text>
<path d="M626 230h12m-4-4 4 4-4 4" fill="none" stroke="#adacff" stroke-width="2"/>
<rect x="644" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#adacff"/>
<text x="662" y="200" fill="#adacff" font-size="16">03</text>
<text x="662" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Render the state</text>
<text x="662" y="263" fill="#a2b2c5" font-size="13">Optional ST7735 reference adapter</text>
<text x="36" y="335" fill="#a2b2c5" font-size="16">Illustrated reference workflow. Hardware commissioning and measurements remain pending.</text>
</g></svg>
